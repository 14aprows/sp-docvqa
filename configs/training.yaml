model:
  name: microsoft/layoutlmv3-base
  max_length: 512

data:
  train_path: data/processed/train_sample.json
  val_path: data/processed/val_sample.json

training:
  output_dir: outputs/checkpoints/layoutlmv3_spdocvqa

  seed: 42
  epochs: 10

  train_batch_size: 2
  val_batch_size: 2

  gradient_accumulation_steps: 4

  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_ratio: 0.1

  max_grad_norm: 1.0
  mixed_precision: true
  num_workers: 0

  early_stopping_patience: 3
  early_stopping_min_delta: 0.001

  resume_from: null
